name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract project
        run: |
          mkdir build-project
          unzip -o *.zip -d build-project

      - name: Fix Java and Kotlin targets
        run: |
          cd build-project/KathaiVilaiyattu_APK_Build_Project
          python3 -c "p='app/build.gradle.kts';s=open(p).read();s=s.replace('android {','android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = \"17\"\n    }',1);open(p,'w').write(s)"

      - name: Build APK
        run: |
          cd build-project/KathaiVilaiyattu_APK_Build_Project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kathai-Vilaiyattu-APK
          path: build-project/KathaiVilaiyattu_APK_Build_Project/app/build/outputs/apk/debug/app-debug.apk
