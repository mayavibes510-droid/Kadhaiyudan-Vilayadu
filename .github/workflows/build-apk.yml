name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract project ZIP
        run: |
          mkdir build-project
          unzip -o *.zip -d build-project
          cd build-project
          if [ -d KathaiVilaiyattu_APK_Build_Project ]; then
            cd KathaiVilaiyattu_APK_Build_Project
          fi
          echo "Project files:"
          ls -la

      - name: Build APK
        run: |
          cd build-project
          if [ -d KathaiVilaiyattu_APK_Build_Project ]; then
            cd KathaiVilaiyattu_APK_Build_Project
          fi
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kathai-Vilaiyattu-APK
          path: build-project/**/app/build/outputs/apk/debug/app-debug.apk
